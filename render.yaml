services:
  - type: web
    name: smart-student-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: ./node_modules/.bin/tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: FLUTTERWAVE_PLAN_MONTHLY_ID
        sync: false
      - key: FLUTTERWAVE_PLAN_YEARLY_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY_ID
        sync: false
      - key: STRIPE_PRICE_YEARLY_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
