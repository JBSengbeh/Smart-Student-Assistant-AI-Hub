services:
  - type: web
    name: smart-student-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: ./node_modules/.bin/tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
